name: Import Gemini source and Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Restore the exact React Capacitor source
        shell: bash
        run: |
          set -euxo pipefail
          base64 --decode gemini-source.tar.xz.b64 | xz --decompress | tar --extract
          test -s src/App.jsx
          test -s package.json
          test -s capacitor.config.json
          rm gemini-source.tar.xz.b64
          rm .github/workflows/import-gemini.yml
      - name: Commit restored source to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore full Gemini PDF Studio Pro source"
          git push origin HEAD:main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Install dependencies and build web app
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Generate Android platform and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Validate APK structure
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk | tail -2
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PDF-Studio-Pro-Gemini-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
